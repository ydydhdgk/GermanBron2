<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хочешь играть / гулять? Бронируй!</title>
<style>
:root{--bg:#f6f3ff;--card:#ffffff;--text:#1d1a2b;--muted:#6b6683;--line:#ddd7f0;--accent:#6c4cf1;--accent-text:#ffffff;--chip:#efeaff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14111f;--card:#201b33;--text:#f2eeff;--muted:#a49dc2;--line:#362f52;--accent:#8f78ff;--accent-text:#12101c;--chip:#2c2547}}
:root[data-theme="dark"]{--bg:#14111f;--card:#201b33;--text:#f2eeff;--muted:#a49dc2;--line:#362f52;--accent:#8f78ff;--accent-text:#12101c;--chip:#2c2547}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:28px;line-height:1.15;margin:8px 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
label,.lbl{display:block;font-weight:600;margin:0 0 8px;font-size:15px}
.field{margin-bottom:20px}
[hidden]{display:none!important}
input[type=text],input[type=time],input[type=date]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{position:relative;display:block;margin:0;cursor:pointer}
.chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.chip span{display:block;text-align:center;padding:12px 6px;border-radius:12px;background:var(--chip);border:2px solid transparent;font-weight:600;font-size:14px}
.chip input:checked+span{border-color:var(--accent);background:var(--accent);color:var(--accent-text)}
.chip input:focus-visible+span{outline:2px solid var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row label{font-weight:500;color:var(--muted);font-size:13px}
button{width:100%;font:inherit;font-weight:700;font-size:17px;padding:15px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-text);cursor:pointer}
button.alt{background:var(--chip);color:var(--text);font-size:15px;margin-top:10px;font-weight:600}
.err{color:#d6336c;font-size:14px;min-height:20px;margin:0 0 10px}
.note{color:var(--muted);font-size:13px;margin:12px 0 0;text-align:center}
#done{display:none;margin-top:16px}
#debtors{margin-top:36px}
#debtors h2{font-size:24px;line-height:1.15;margin:0 0 6px}
#dgrid{display:grid;grid-template-columns:1fr;gap:16px}
#debtors .dcard{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
#debtors .ph{width:100%;aspect-ratio:1/1;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:72px}
#debtors .ph img{width:100%;height:100%;object-fit:cover;display:block}
#debtors .dbody{padding:16px}
#debtors .dname{font-weight:700;font-size:20px;margin:0 0 6px}
#debtors .debt{margin:0 0 14px}
#debtors .debt b{color:var(--accent)}
#debtors .t{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
#debtors .t div{background:var(--chip);border-radius:12px;padding:8px 2px}
#debtors .t strong{display:block;font-size:22px;font-variant-numeric:tabular-nums}
#debtors .t span{font-size:11px;color:var(--muted)}
#debtors .dl{color:var(--muted);font-size:12px;margin:10px 0 0}
#debtors .over{background:var(--accent);color:var(--accent-text);border-radius:12px;padding:12px;text-align:center;font-weight:700}
#debtors .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
#debtors .gal img{flex:0 0 100%;width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 30%;scroll-snap-align:center;display:block}
#debtors .hint{color:var(--muted);font-size:12px;margin:0;padding:8px 16px 0}
</style>
</head>
<body>
<main>
<h1>Хочешь играть / гулять? Бронируй!</h1>
<p class="sub">Заполни анкету — и она улетит мне в Telegram.</p>

<form id="f" novalidate>
  <div class="field">
    <label for="name">Твоё имя</label>
    <input type="text" id="name" placeholder="Как тебя зовут?" autocomplete="given-name">
  </div>

  <div class="field">
    <span class="lbl">Что хочешь?</span>
    <div class="chips">
      <label class="chip"><input type="radio" name="act" value="Играть"><span>🎮 Играть</span></label>
      <label class="chip"><input type="radio" name="act" value="Гулять"><span>🚶 Гулять</span></label>
      <label class="chip"><input type="radio" name="act" value="Общаться"><span>💬 Общаться</span></label>
    </div>
  </div>

  <div class="field" id="detailBox" hidden>
    <label for="detail" id="detailLbl"></label>
    <input type="text" id="detail" maxlength="120">
  </div>

  <div class="field">
    <label for="date">Когда (дата)</label>
    <input type="date" id="date">
  </div>

  <div class="field">
    <span class="lbl">Время</span>
    <div class="row">
      <div><label for="from">С</label><input type="time" id="from"></div>
      <div><label for="to">До</label><input type="time" id="to"></div>
    </div>
  </div>

  <p class="err" id="err" role="alert"></p>
  <button type="submit">Отправить анкету</button>
  <p class="note">Откроется Telegram с готовым сообщением — останется нажать «Отправить».</p>

  <div id="done">
    <button type="button" class="alt" id="copy">Скопировать текст анкеты</button>
  </div>
</form>
<section id="debtors">
  <h2>🚨 Доска должников</h2>
  <p class="sub">Пора возвращать долги. Время идёт.</p>
  <div id="dgrid"></div>
</section>
</main>

<script>
(function(){
  var TG = "hizidi";
  var f = document.getElementById("f"), err = document.getElementById("err");
  var done = document.getElementById("done"), lastText = "";
  var today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
  document.getElementById("date").min = today.toISOString().slice(0,10);

  var Q = {
    "Играть": ["В какую игру?", "Например: Minecraft, CS2, шахматы…", "Игра"],
    "Гулять": ["В какое место?", "Например: парк, набережная, центр…", "Место"],
    "Общаться": ["О чём?", "Например: кино, музыка, жизнь…", "Тема"]
  };
  var detailBox = document.getElementById("detailBox"), detail = document.getElementById("detail");
  var radios = f.querySelectorAll('input[name="act"]');
  for(var i = 0; i < radios.length; i++){
    radios[i].addEventListener("change", function(){
      var q = Q[this.value];
      document.getElementById("detailLbl").textContent = q[0];
      detail.placeholder = q[1];
      detailBox.hidden = false;
    });
  }

  function fmtDate(v){ var p = v.split("-"); return p[2] + "." + p[1] + "." + p[0]; }

  f.addEventListener("submit", function(e){
    e.preventDefault();
    var name = document.getElementById("name").value.trim();
    var act = f.querySelector('input[name="act"]:checked');
    var date = document.getElementById("date").value;
    var from = document.getElementById("from").value;
    var to = document.getElementById("to").value;
    err.textContent = "";
    if(!name){ err.textContent = "Напиши своё имя."; return; }
    if(!act){ err.textContent = "Выбери: играть, гулять или общаться."; return; }
    var det = detail.value.trim();
    if(!det){ err.textContent = Q[act.value][0] + " Напиши ответ."; return; }
    if(!date){ err.textContent = "Выбери дату."; return; }
    if(!from || !to){ err.textContent = "Укажи время «с» и «до»."; return; }
    if(to <= from){ err.textContent = "Время «до» должно быть позже времени «с»."; return; }

    lastText = "📋 Новая анкета\n" +
      "Имя: " + name + "\n" +
      "Хочет: " + act.value + "\n" +
      Q[act.value][2] + ": " + det + "\n" +
      "Дата: " + fmtDate(date) + "\n" +
      "Время: с " + from + " до " + to;

    done.style.display = "block";
    window.location.href = "https://t.me/" + TG + "?text=" + encodeURIComponent(lastText);
  });

  document.getElementById("copy").addEventListener("click", function(){
    var b = this;
    try{
      navigator.clipboard.writeText(lastText).then(function(){ b.textContent = "Скопировано ✓"; },
        function(){ b.textContent = "Не удалось скопировать"; });
    }catch(e){ b.textContent = "Не удалось скопировать"; }
  });
})();
</script>

(function(){
  var grid = document.getElementById("dgrid"), cards = [];
  function esc(s){ var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function dlText(iso){
    try{ return new Date(iso).toLocaleString("ru-RU", {timeZone:"Asia/Almaty", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit"}) + " (время Казахстана)"; }catch(e){ return ""; }
  }
  DEBTORS.forEach(function(d){
    var el = document.createElement("div");
    el.className = "dcard";
    el.innerHTML =
      (d.photos && d.photos.length ? '<div class="gal">' + d.photos.map(function(p){ return '<img src="' + p + '" alt="' + esc(d.name) + '">'; }).join("") + '</div>' + (d.photos.length > 1 ? '<p class="hint">📸 ' + d.photos.length + ' фото — листай вбок →</p>' : "") : '<div class="ph">🙈</div>') +
      '<div class="dbody"><p class="dname">' + esc(d.name) + '</p>' +
      '<p class="debt">Должен вернуть: <b>' + esc(d.debt) + '</b></p>' +
      '<div class="cd"></div><p class="dl">Срок: ' + dlText(d.deadline) + '</p></div>';
    grid.appendChild(el);
    cards.push({ box: el.querySelector(".cd"), end: Date.parse(d.deadline) });
  });
  function tick(){
    var now = Date.now();
    cards.forEach(function(c){
      var left = Math.floor((c.end - now) / 1000);
      if(left <= 0){ c.box.innerHTML = '<div class="over">⏰ Срок вышел! Верни долг!</div>'; return; }
      var d = Math.floor(left / 86400), h = Math.floor(left % 86400 / 3600), m = Math.floor(left % 3600 / 60), s = left % 60;
      c.box.innerHTML = '<div class="t"><div><strong>' + d + '</strong><span>дн</span></div>' +
        '<div><strong>' + pad(h) + '</strong><span>час</span></div>' +
        '<div><strong>' + pad(m) + '</strong><span>мин</span></div>' +
        '<div><strong>' + pad(s) + '</strong><span>сек</span></div></div>';
    });
  }
  tick(); setInterval(tick, 1000);
})();
